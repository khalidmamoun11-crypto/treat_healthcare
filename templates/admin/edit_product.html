{% extends 'base.html' %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card">
                <div class="card-body">
                    <h4 class="card-title">
                        <i class="bi bi-pencil-square text-primary"></i>
                        {{ 'Edit Plan' if product else 'Add New Plan' }}
                    </h4>
                    <hr>
                    
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Plan Name *</label>
                            <input type="text" name="name" class="form-control" value="{{ product.name if product else '' }}" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Short Description</label>
                            <input type="text" name="short_description" class="form-control" value="{{ product.short_description if product else '' }}">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Full Description *</label>
                            <textarea name="description" class="form-control" rows="4" required>{{ product.description if product else '' }}</textarea>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Price ($) *</label>
                                <input type="number" step="0.01" name="price" class="form-control" value="{{ product.price if product else '' }}" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Discount (%)</label>
                                <input type="number" step="0.1" name="discount_percentage" class="form-control" value="{{ product.discount_percentage if product else 0 }}">
                            </div>
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Category *</label>
                                <select name="category" class="form-select" required>
                                    <option value="">Select Category</option>
                                    <option value="International Insurance" {% if product and product.category == 'International Insurance' %}selected{% endif %}>International Insurance</option>
                                    <option value="Global Medical Access" {% if product and product.category == 'Global Medical Access' %}selected{% endif %}>Global Medical Access</option>
                                    <option value="Cross-Border Staffing" {% if product and product.category == 'Cross-Border Staffing' %}selected{% endif %}>Cross-Border Staffing</option>
                                </select>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Subcategory</label>
                                <input type="text" name="subcategory" class="form-control" value="{{ product.subcategory if product else '' }}">
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Image URL</label>
                            <input type="url" name="image_url" class="form-control" value="{{ product.image_url if product else '' }}" placeholder="https://via.placeholder.com/600x400/...">
                        </div>
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Stock Quantity</label>
                                <input type="number" name="stock_quantity" class="form-control" value="{{ product.stock_quantity if product else 999 }}">
                            </div>
                            <div class="col-md-6 mb-3">
                                <div class="form-check mt-4">
                                    <input type="checkbox" name="featured" class="form-check-input" id="featured" {% if product and product.featured %}checked{% endif %}>
                                    <label class="form-check-label" for="featured">Featured Product</label>
                                </div>
                            </div>
                        </div>
                        
                        <div class="d-grid gap-2 d-md-flex">
                            <button type="submit" class="btn btn-primary">
                                <i class="bi bi-check-circle"></i> {{ 'Update' if product else 'Create' }} Plan
                            </button>
                            <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
